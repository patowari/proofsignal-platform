# Local development services.
#
# The application must also run with these absent -- optional providers degrade
# rather than crash, and the default test suite passes with no Docker at all.
# These are what the `integration`-marked tests exercise.
#
# PORTS: deliberately non-default (55432/56379/59000/59001).
# This machine already runs other stacks on 5432, 6379, and 9000. Binding the
# standard ports would either fail to start or, far worse, silently point our
# migrations at somebody else's database. Host ports are namespaced to this
# project; the containers still use standard ports internally.

services:
  postgres:
    # pgvector/pgvector ships PostgreSQL with the vector extension prebuilt,
    # which avoids compiling it into a stock postgres image.
    image: pgvector/pgvector:pg16
    container_name: verifier-postgres
    environment:
      POSTGRES_USER: verifier
      POSTGRES_PASSWORD: verifier
      POSTGRES_DB: verifier
      # Deterministic collation: text ordering affects full-text search results,
      # so it should not vary with the host locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verifier -d verifier"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: verifier-redis
    ports:
      - "56379:6379"
    # Jobs must survive a restart: an in-flight verification should not vanish
    # because the queue lost its state.
    command: redis-server --appendonly yes --save 60 1
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: verifier-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "59000:9000"   # S3 API
      - "59001:9001"   # web console
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
