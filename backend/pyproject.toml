[project]
name = "verifier-backend"
version = "0.1.0"
description = "Evidence-backed information verification platform"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "redis>=5.2",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
    "structlog>=24.4",
    "boto3>=1.35",
    "trafilatura>=2.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "feedparser>=6.0.11",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "Pillow>=11.0",
    "imagehash>=4.3",
    "anyio>=4.6",
    "tenacity>=9.0",
]

[project.optional-dependencies]
# Heavy ML extras. The app must import, boot, serve, and pass the default test
# suite without these installed. Providers import them lazily.
ml = [
    "sentence-transformers>=3.3",
    "torch>=2.5",
    "transformers>=4.46",
]
ocr = ["pytesseract>=0.3.13"]
stt = ["faster-whisper>=1.1"]
cv = ["opencv-python-headless>=4.10"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
    "types-python-dateutil",
    "respx>=0.22",
    "fakeredis>=2.26",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "S", "ASYNC", "RUF"]
ignore = ["E501", "B008", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N806"]
# The injection tests deliberately contain homoglyphs and zero-width characters:
# those characters ARE the attack under test.
"tests/test_untrusted.py" = ["S", "N806", "RUF001", "RUF003"]
"tests/test_url_validation.py" = ["S", "N806", "RUF001", "RUF003"]
# Bangla text and typographic punctuation are the subject matter here, not a
# typo: the dashes and Bengali markers must stay exactly as written.
"app/retrieval/evidence.py" = ["RUF001", "RUF003"]
"app/retrieval/scoring.py" = ["RUF001", "RUF003"]
"app/verification/claim_extraction.py" = ["RUF001", "RUF003"]
"alembic/*" = ["N999", "F401"]
# Entrypoints must set the asyncio loop policy before importing anything that
# creates a loop or a database connection, so imports cannot come first.
"app/main.py" = ["E402"]
"app/workers/worker.py" = ["E402"]
"run_api.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Default run excludes anything needing Docker, network, or ML extras.
addopts = "-m 'not integration and not live and not heavy' --strict-markers"
markers = [
    "integration: needs PostgreSQL/Redis/MinIO via docker compose",
    "live: needs internet access (GDELT, RSS)",
    "slow: long-running",
    "heavy: needs ML extras (torch, sentence-transformers, OCR, whisper)",
]
